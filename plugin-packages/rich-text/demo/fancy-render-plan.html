<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>富文本花字编辑器</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f5f7fb;
        --muted: #929bad;
        --quiet: #6f7889;
        --line: rgba(255, 255, 255, .1);
        --panel: #2c2c2c;
        --panel-raised: #383838;
        --panel-deep: #222222;
        --blue: #0d99ff;
        --mint: #75f0c7;
        --violet: #9c8dff;
        --stage: #0c1119;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 72% 8%, rgba(117, 240, 199, .12), transparent 28rem),
          radial-gradient(circle at 8% 88%, rgba(138, 125, 255, .12), transparent 28rem),
          #080b11;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, textarea { font: inherit; }
      button { color: inherit; }
      button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

      .shell {
        width: min(1280px, calc(100% - 40px));
        margin: 0 auto;
        padding: 36px 0 56px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--mint);
        font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--mint); }

      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-top: 14px;
      }
      h1 { margin: 0; font-size: clamp(34px, 5vw, 58px); line-height: .98; letter-spacing: -.055em; }
      .lede { max-width: 500px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(340px, .8fr);
        gap: 18px;
        margin-top: 30px;
        align-items: start;
      }

      .card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(15, 19, 27, .88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
        backdrop-filter: blur(18px);
      }

      .stage-card {
        position: sticky;
        top: 16px;
        align-self: start;
        min-height: 620px;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 58px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }
      .card-head h2 { margin: 0; font-size: 13px; letter-spacing: .02em; }
      .status { display: inline-flex; align-items: center; gap: 7px; color: #b6c1d2; font-size: 11px; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 14px var(--mint); }

      .stage {
        position: relative;
        display: grid;
        min-height: 560px;
        place-items: center;
        padding: 42px 24px;
        background:
          linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
          radial-gradient(circle at 50% 42%, rgba(117, 240, 199, .09), transparent 24rem),
          var(--stage);
        background-size: 32px 32px, 32px 32px, auto;
      }
      .stage::after {
        position: absolute;
        right: 18px;
        bottom: 14px;
        color: rgba(255,255,255,.3);
        content: "CANVAS / WEBGL";
        font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .13em;
      }
      #J-container { width: min(680px, 100%); height: 330px; }
      #J-container canvas { display: block; }

      .editor-card { background: var(--panel); }
      .editor-body { padding: 12px; }
      .editor-title-meta { color: var(--quiet); font-size: 11px; }

      .preset-strip { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 12px; border-bottom: 1px solid #414141; }
      .preset-button, .scope-button, .segment-row, .tool-button, .layer-action { border: 0; cursor: pointer; }
      .preset-button {
        flex: 1;
        min-width: 74px;
        padding: 7px 9px;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        background: #3d3d3d;
        color: #a8a8a8;
        font-size: 11px;
        transition: background .15s, color .15s, border-color .15s;
      }
      .preset-button:hover, .preset-button[data-active="true"] { border-color: var(--blue); background: var(--blue); color: #fff; }

      .scope-label, .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 0 8px;
        color: #9f9f9f;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .04em;
        text-transform: uppercase;
      }
      .scope-label small, .section-label small { color: var(--quiet); font-size: 10px; font-weight: 400; text-transform: none; letter-spacing: 0; }
      .scope-switch { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 3px; }
      .scope-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
        padding: 7px 9px;
        border: 1px solid #4a4a4a;
        border-radius: 999px;
        background: #343434;
        color: #a9a9a9;
        font-size: 11px;
        white-space: nowrap;
      }
      .scope-button { cursor: default; }
      .scope-button[data-active="true"] { border-color: var(--mint); background: rgba(117, 240, 199, .14); color: #eafff8; cursor: default; }
      .scope-dot, .segment-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 8px currentColor; }
      .scope-button.object .scope-dot { background: var(--violet); }

      .text-editor { margin-top: 10px; padding: 10px; border: 1px solid #454545; border-radius: 6px; background: var(--panel-deep); }
      .text-editor-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
      .text-editor-head strong { font-size: 11px; }
      .text-editor-head span { color: var(--quiet); font-size: 10px; }
      textarea {
        display: block;
        width: 100%;
        min-height: 76px;
        resize: vertical;
        padding: 8px;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        background: #303030;
        color: #e9e9e9;
        font-size: 12px;
        line-height: 1.55;
      }
      textarea:focus { border-color: var(--blue); outline: none; }
      .text-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
      .selection-status { overflow: hidden; color: var(--quiet); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .tool-button { padding: 6px 8px; border: 1px solid #4b4b4b; border-radius: 4px; background: transparent; color: #c8c8c8; font-size: 10px; }
      .tool-button:hover:not(:disabled) { border-color: var(--blue); color: #fff; }
      .tool-button:disabled { cursor: not-allowed; opacity: .4; }

      .segment-list { display: grid; gap: 5px; margin-top: 8px; }
      .segment-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px;
        border: 1px solid transparent;
        border-radius: 5px;
        background: #3d3d3d;
        text-align: left;
      }
      .segment-row { cursor: default; }
      .segment-row:hover { background: #464646; }
      .segment-row[data-active="true"] { border-color: var(--blue); background: #3b4854; }
      .segment-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 2px; }
      .segment-copy strong { overflow: hidden; color: #e8e8e8; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .segment-copy small { color: #949494; font-size: 10px; }
      .segment-arrow { color: #888; font-size: 15px; }

      .section { border-top: 1px solid #414141; }
      .section-label { padding-top: 14px; }
      .inherit-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; padding: 8px; border-radius: 4px; background: rgba(117, 240, 199, .08); color: #a7d8ca; font-size: 10px; }
      .inherit-row.override { background: rgba(156, 141, 255, .1); color: #cbc3ff; }
      .layer-card { margin-bottom: 7px; border: 1px solid #4a4a4a; border-radius: 5px; background: #3d3d3d; }
      .layer-card.disabled { opacity: .55; }
      .layer-head { display: flex; align-items: center; gap: 8px; padding: 8px; }
      .layer-toggle { width: 16px; height: 16px; margin: 0; accent-color: var(--blue); }
      .layer-preview { width: 24px; height: 24px; flex: 0 0 auto; border: 1px solid #555; border-radius: 4px; background: var(--mint); }
      .layer-info { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 2px; }
      .layer-info strong { color: #e3e3e3; font-size: 11px; font-weight: 500; }
      .layer-info small { color: #989898; font-size: 10px; }
      .layer-actions { display: flex; gap: 3px; }
      .layer-action { width: 20px; height: 20px; border-radius: 3px; background: transparent; color: #999; font-size: 13px; }
      .layer-action:hover { background: #555; color: #fff; }
      .layer-params { display: grid; gap: 7px; padding: 8px; border-top: 1px solid #4a4a4a; background: #353535; }
      .param-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) 40px; align-items: center; gap: 7px; }
      .param-row.wide { grid-template-columns: 58px minmax(0, 1fr); }
      .param-row label { color: #a3a3a3; font-size: 10px; }
      .param-row output { color: #e0e0e0; font-size: 10px; text-align: right; }
      input[type="range"] { width: 100%; accent-color: var(--blue); }
      input[type="color"] { width: 32px; height: 22px; padding: 2px; border: 1px solid #505050; border-radius: 3px; background: #282828; cursor: pointer; }
      .param-row input[type="color"] { grid-column: 2 / 4; justify-self: start; }
      .locked-note { padding: 8px; color: #aaa; font-size: 10px; line-height: 1.5; }
      .selection-values { display: grid; gap: 4px; padding: 8px; border-top: 1px solid #4a4a4a; background: #303030; }
      .selection-values-title { color: #8f8f8f; font-size: 10px; }
      .selection-value-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #a8a8a8; font-size: 10px; }
      .selection-value-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .selection-value-row strong { flex: 0 0 auto; color: #e6e6e6; font-size: 10px; font-weight: 500; }

      .diagnostics { margin-top: 14px; border-top: 1px solid #414141; padding-top: 11px; }
      .diagnostics summary { cursor: pointer; color: #8e8e8e; font-size: 10px; }
      .metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-top: 8px; }
      .metric { display: flex; justify-content: space-between; gap: 8px; padding: 7px; border-radius: 4px; background: #252525; color: #888; font-size: 10px; }
      .metric strong { color: #e2e2e2; font-weight: 500; }
      .scope-map { display: grid; gap: 4px; margin-top: 8px; }
      .scope-map-row { display: flex; gap: 7px; color: #949494; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .scope-map-row code { color: #c6c6c6; }

      @media (max-width: 900px) {
        .shell { width: min(100% - 24px, 680px); padding-top: 24px; }
        .intro { display: block; }
        .lede { margin-top: 12px; }
        .layout { grid-template-columns: 1fr; }
        .stage-card { position: static; }
        .stage-card { min-height: 0; }
        .stage { min-height: 420px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="eyebrow">RichText / Fancy Editor</div>
      <div class="intro">
        <h1>富文本花字</h1>
        <p class="lede">沿用平台文本花字面板。先切段，再针对当前片段编辑 Fill、Stroke 和 Shadow；Glow 保持为全文效果。</p>
      </div>

      <section class="layout">
        <article class="card stage-card">
          <header class="card-head">
            <h2>实时预览</h2>
            <span class="status" id="status">initializing</span>
          </header>
          <div class="stage"><div id="J-container"></div></div>
        </article>

        <aside class="card editor-card">
          <header class="card-head">
            <h2>花字样式编辑器</h2>
            <span class="editor-title-meta">RichText</span>
          </header>
          <div class="editor-body">
            <div class="section-label"><span>预设</span><small>应用到全文和片段</small></div>
            <div class="preset-strip" id="preset-list"></div>

            <div class="scope-label"><span>当前作用范围</span><small id="scope-summary">全文</small></div>
            <div class="scope-switch" id="scope-switch"></div>

            <div class="text-editor">
              <div class="text-editor-head"><strong>文本与切段</strong><span>选择文字后拆分</span></div>
              <textarea id="text" spellcheck="false">Range A  Range B
跨行仍是同一个 source range</textarea>
              <div class="text-tools">
                <span class="selection-status" id="selection-status">未选择文字</span>
                <div>
                  <button class="tool-button" id="split-selection" type="button" disabled>拆分为片段</button>
                  <button class="tool-button" id="merge-selection" type="button" disabled>合并片段</button>
                </div>
              </div>
            </div>

            <div class="section-label"><span>片段</span><small>跟随文本选区</small></div>
            <div class="segment-list" id="segment-list"></div>

            <div id="editor-sections"></div>

            <details class="diagnostics">
              <summary>Render plan diagnostics</summary>
              <div class="metric-grid">
                <div class="metric"><span>Glyphs</span><strong id="glyph-count">—</strong></div>
                <div class="metric"><span>Ranges</span><strong id="range-count">—</strong></div>
                <div class="metric"><span>Padding</span><strong id="padding-readout">—</strong></div>
                <div class="metric"><span>Surface</span><strong id="surface-readout">—</strong></div>
              </div>
              <div class="scope-map" id="range-list"></div>
              <div class="scope-map" id="object-list"></div>
            </details>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="./src/fancy-render-plan.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUI Clip and Scroll</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #11151d; color: #edf1f7; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 16px; padding: 12px 18px; background: #1b2230; }
    header strong { margin-right: auto; }
    button { padding: 7px 12px; border: 1px solid #526078; border-radius: 6px; color: #edf1f7; background: #2a3446; cursor: pointer; }
    button:hover { background: #35435a; }
    #stage { flex: 1; min-height: 0; position: relative; }
    #stage canvas { display: block; }
  </style>
</head>
<body>
  <header>
    <strong>GUI 裁剪、双轴滚动、嵌套滚动和旋转 AABB 裁剪</strong>
    <span>可使用滚轮或触摸拖动</span>
    <button id="focus-last" type="button">聚焦最后一项</button>
  </header>
  <div id="stage"></div>
  <script type="module" src="../src/gui-scroll.ts"></script>
</body>
</html>

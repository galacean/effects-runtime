<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>矢量羽化 - Runtime Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #202630;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, select, input { font: inherit; }
    a { color: inherit; text-decoration: none; }
    main { max-width: 1440px; margin: 0 auto; padding: 32px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin: 24px 0; }
    h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -1px; }
    p { margin: 0; color: #727a86; }
    .back { color: #727a86; font-size: 13px; }
    .badge { padding: 5px 12px; border: 1px solid #dce0e5; border-radius: 20px; white-space: nowrap; font-size: 12px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 256px; gap: 20px; }
    .preview, .controls { overflow: hidden; border: 1px solid #e0e3e8; border-radius: 12px; background: white; }
    .preview-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #e8ebef; }
    .preview-header span { color: #868d97; font-size: 12px; }
    .stage {
      --base: #141b25;
      --tile: #1b2431;
      --label: #b4bdcc;
      position: relative;
      height: 540px;
      background-color: var(--base);
      background-image: conic-gradient(var(--tile) 25%, transparent 0 50%, var(--tile) 0 75%, transparent 0);
      background-size: 24px 24px;
    }
    .stage[data-background="light"] { --base: #f5f6f8; --tile: #e9ecf1; --label: #616a78; }
    .stage[data-background="dark"] { background-image: none; }
    #J-container { position: absolute; inset: 0; }
    #J-container canvas { display: block; }
    .divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #8390a52e; pointer-events: none; }
    .label { position: absolute; top: 18px; width: 50%; text-align: center; color: var(--label); font-size: 12px; pointer-events: none; }
    .label-right { left: 50%; }
    .label strong { font-weight: 500; color: #ffb58e; }
    .preview-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 14px 20px; font-size: 12px; color: #727a86; }
    .controls { padding: 22px; }
    .controls h2 { margin: 0 0 22px; font-size: 15px; }
    .field { display: block; margin-bottom: 23px; }
    .field-name { display: flex; justify-content: space-between; margin-bottom: 9px; font-size: 13px; }
    output { color: #da6938; font-variant-numeric: tabular-nums; }
    select, input[type="number"] { width: 100%; padding: 9px 10px; border: 1px solid #dce0e6; border-radius: 6px; background: #fff; color: #303945; }
    input[type="range"] { width: 100%; margin: 0; accent-color: #eb8853; cursor: pointer; }
    .range-labels { display: flex; justify-content: space-between; color: #969da7; font-size: 11px; }
    button { width: 100%; padding: 9px 12px; border: 1px solid #dce0e6; border-radius: 6px; background: #f7f8fa; color: #444e5b; cursor: pointer; }
    button:hover { background: #edf0f4; }
    select:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #eb8853; outline-offset: 3px; }
    .note { margin-top: 18px; font-size: 12px; }
    #status[data-error="true"] { color: #b33c30; }
    @media (max-width: 820px) {
      main { padding: 20px; }
      .workspace { grid-template-columns: 1fr; }
      .stage { height: 460px; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
      .controls h2, .controls button, .note { grid-column: 1 / -1; }
      header { align-items: start; }
    }
    @media (max-width: 480px) {
      main { padding: 14px; }
      h1 { font-size: 25px; }
      .stage { height: 420px; }
      .controls { padding: 18px; column-gap: 16px; }
      .preview-header, .preview-footer { padding: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../index.html">← Runtime Demo</a>
    <header>
      <div>
        <h1>矢量羽化</h1>
        <p>并排比较原始边缘与羽化边缘，实时调整柔化程度。</p>
      </div>
      <span class="badge">WebGL 2</span>
    </header>
    <div class="workspace">
      <section class="preview" aria-label="羽化效果预览">
        <div class="preview-header"><strong>效果对照</strong><span>Fill &amp; Stroke</span></div>
        <div class="stage" id="stage" data-background="checker">
          <div id="J-container"></div>
          <div class="divider"></div>
          <div class="label">原始边缘 · 0 px</div>
          <div class="label label-right">羽化边缘 · <strong id="radius-label">12 px</strong></div>
        </div>
        <div class="preview-footer">
          <span id="status" role="status" aria-live="polite">正在准备场景…</span>
          <span>左右使用相同的图形与颜色</span>
        </div>
      </section>
      <form class="controls" id="controls">
        <h2>演示参数</h2>
        <label class="field">
          <span class="field-name">羽化半径 <output id="radius-value" for="radius">12 px</output></span>
          <input id="radius" name="radius" type="range" min="0" max="500" step="1" value="12">
          <span class="range-labels"><span>0 px</span><span id="radius-limit">500 px</span></span>
        </label>
        <label class="field">
          <span class="field-name">最大半径（px）</span>
          <input id="radius-max" name="radiusMax" type="number" min="1" step="1" value="500" required>
        </label>
        <label class="field">
          <span class="field-name">图形</span>
          <select id="shape" name="shape">
            <option value="mixed">混合图形</option>
            <option value="rectangle">圆角矩形</option>
            <option value="ellipse">圆形</option>
            <option value="star">五角星</option>
          </select>
        </label>
        <label class="field">
          <span class="field-name">填充颜色</span>
          <select id="paint" name="paint">
            <option value="linear">线性渐变</option>
            <option value="solid">纯色</option>
            <option value="radial">径向渐变</option>
            <option value="angular">角度渐变</option>
          </select>
        </label>
        <label class="field">
          <span class="field-name">绘制内容</span>
          <select id="layers" name="layers">
            <option value="fill">填充</option>
            <option value="stroke">描边</option>
            <option value="both">填充 + 描边</option>
          </select>
        </label>
        <label class="field">
          <span class="field-name">每侧图形数量</span>
          <select id="count" name="count">
            <option value="1">1 个</option>
            <option value="3" selected>3 个</option>
            <option value="6">6 个</option>
            <option value="12">12 个</option>
            <option value="24">24 个</option>
          </select>
        </label>
        <label class="field">
          <span class="field-name">预览背景</span>
          <select id="background" name="background">
            <option value="checker">深色棋盘格</option>
            <option value="dark">纯深色</option>
            <option value="light">浅色棋盘格</option>
          </select>
        </label>
        <button id="reset-params" type="button">恢复默认参数</button>
        <p class="note">半径为 0 时关闭羽化。增加数量可观察多个形状同时羽化的效果。</p>
      </form>
    </div>
  </main>
  <script type="module" src="../src/shape-feather.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频元素 - demo</title>
  <style>
    html, body, div, canvas { margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background: #252525; color: white; font: 14px/1.6 system-ui, sans-serif; }
    .preview-area { display: flex; justify-content: center; flex: 0 0 50%; min-height: 0; overflow: hidden; background: black; }
    .controls-area { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; }
    .control-panel { min-width: 0; width: 100%; box-sizing: border-box; margin: 0; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border: 0; }
    .control-panel > div { flex-wrap: wrap; margin-bottom: 8px; }
    .control-panel button { min-height: 44px; touch-action: manipulation; }
    #replacement-panel { border-top: 1px solid #666; margin-top: 12px; padding-top: 12px; }
    #video-url { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
    #replacement-panel button { padding: 6px 10px; cursor: pointer; }
    #current-url { overflow-wrap: anywhere; }
    #status[data-error="true"] { color: #ffb4ab; }
    #playback { font-variant-numeric: tabular-nums; }
    .container {
      position: relative;
      aspect-ratio: 375 / 812;
      max-width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,255);
    }
    .container canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<div class="preview-area">
  <div class="container" id="J-container"></div>
</div>
<div class="controls-area" id="controls-area"></div>

<section id="replacement-panel">
  <form id="video-form">
    <label for="video-url">替换视频 URL</label>
    <input id="video-url" type="url" required>
    <div class="row">
      <button type="submit">更换视频</button>
      <button type="button" id="sample-a">复原</button>
      <button type="button" id="invalid-url">测试加载失败</button>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite">正在加载初始视频…</p>
  <div id="playback">等待视频初始化…</div>
  <div>当前视频：<span id="current-url">—</span></div>
</section>
<script type="module" src="../src/video.ts"></script>
</body>
</html>

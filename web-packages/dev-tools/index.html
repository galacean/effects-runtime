<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effects Editor</title>
  <style>
    html, body, div, 
    canvas { 
      margin: 0; 
      padding: 0; 
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 640px;
      height: 360px;
      overflow: hidden;
      background-color: rgba(0,0,0,255);
    }
    #J-container .text-gizmo-custom-style {
      caret-color: #f2f2f2;
    }
    #J-container .text-gizmo-custom-style,
    #J-container .text-gizmo-pointer-selection-preview {
      visibility: var(--scene-text-edit-visibility, hidden);
    }
    .bg {
      position: fixed;
      width: 100%;
      height: 100%;
      background-color: rgba(25,25,25,255);
    }
  </style>
</head>
<body>
<div class="bg" id="J-bg"></div>
<div class="container" id="J-container"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
